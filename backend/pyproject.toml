[project]
name = "secretaria-backend"
version = "1.0.0"
description = "Secretar.ia - backend FastAPI multi-tenant para clinicas (WhatsApp + IA)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "prisma>=0.15.0",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "bcrypt>=4.3",
    "aiosmtplib>=4.0",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["generated_prisma", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires DATABASE_URL pointing at a live PostgreSQL"]
