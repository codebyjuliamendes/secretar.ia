name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: secretaria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secretaria_test?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123
      WHATSAPP_APP_SECRET: ci-whatsapp-secret
      EVOLUTION_WEBHOOK_TOKEN: ci-evolution-token
      STRIPE_WEBHOOK_SECRET: whsec_ci
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen
      - name: Gerar Prisma Client
        run: uv run prisma generate --schema=prisma/schema.prisma
      - name: Lint e formatação (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Aplicar migrations
        run: uv run prisma migrate deploy --schema=prisma/schema.prisma
      - name: Schema e migrations estão em sincronia
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE secretaria_shadow"
          uv run prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/secretaria_shadow" \
            --exit-code
      - name: Testes (unitários + integração)
        run: uv run pytest -q
      - name: Fail-fast de configuração em produção
        run: |
          if APP_ENV=production JWT_SECRET= WHATSAPP_APP_SECRET= CRON_SECRET= \
             uv run python -c "from app.config import get_settings; get_settings()"; then
            echo "Deveria falhar sem segredos" && exit 1
          fi
          echo "fail-fast OK"

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: http://localhost:8000

  docker:
    name: Imagem Docker do backend
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
